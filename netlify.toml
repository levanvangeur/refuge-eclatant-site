# Déploiement Netlify — livret d'accueil statique
# Le dossier « frontend » est publié tel quel (aucun build nécessaire).
[build]
  publish = "frontend"
  command = ""

# Repli : toute route inconnue renvoie vers le livret
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# En-têtes de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
